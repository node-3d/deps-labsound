name: Test
defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            build_platform: x64
            cmake_toolset: v142
          - target: windows-arm64
            os: windows-11-vs2026-arm
            node_arch: arm64
            build_platform: ARM64
            vs_prerelease: true
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
          - target: darwin-x64
            os: macos-26
            node_arch: x64
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Add msbuild to PATH
        if: startsWith(matrix.target, 'windows-')
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.node_arch }}
          vs-prerelease: ${{ matrix.vs_prerelease || false }}

      - name: Build Pre Step
        run: chmod +x src/extract.sh && src/extract.sh

      - name: Build Unix Binaries
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        run: node src/build-unix
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args || '' }}

      - name: Build Windows Binaries
        if: startsWith(matrix.target, 'windows-')
        run: src/windows.sh
        env:
          BUILD_PLATFORM: ${{ matrix.build_platform }}
          CMAKE_TOOLSET: ${{ matrix.cmake_toolset || '' }}

      - name: Stage Built Binaries
        run: node src/build-post

      - name: Run Unit Tests
        run: npm run test:ci
